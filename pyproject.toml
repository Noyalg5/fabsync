[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fabsync"
version = "0.1.0"
description = "Systems integration, data governance and management reporting demonstrator for a UK steelwork fabricator. Synthetic data only."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "streamlit==1.64.0",
    "duckdb==1.5.5",
    "pandas==3.0.6",
    "pyarrow==25.0.1",
    "numpy==2.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
