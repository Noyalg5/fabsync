# FabSync KPI definitions. All data these KPIs are calculated from is synthetic.
#
# Every KPI must have every field below filled in; the build refuses a KPI with
# an empty caveat. The views themselves are in src/fabsync/kpi/sql; each view
# listed here gets its description attached as a comment in the warehouse.
#
# headline: one SQL expression returning the single figure for the scorecard.
# direction: higher | lower | band (target_low to target_high) | none

parameters:
  bar_length_mm: 12000   # stock length sections are bought in; drives cut yield

helpers:
  marts.parameters: One-row table of the settings the KPI views use (as-of date, labour rate, bar length, targets).
  marts.material_price: Average price paid per kilogram for each canonical material on Corvus purchase orders.
  marts.bom_line_material: Every BOM line with its canonical material, section type, kilograms and value.
  marts.works_order_weight: Weight and material value of each works order, from its BOM.
  marts.works_order_despatch: The delivery note that despatched each finished works order, matched by job and date.
  marts.job_customer: Customer and site of each Corvus job, taking the customer name from finance invoices.

kpis:

  - id: KPI-01
    name: OTIF delivery performance
    definition: The share of deliveries that reached the customer by the promised date with the full tonnage on the lorry.
    formula: deliveries despatched on or before the promised date AND with delivery-note tonnage at least 98% of the works order weight, divided by deliveries with a promised date, x 100
    sources: shop_floor.delivery_notes (despatch_date, promised_date, tonnage, job); corvus_mrp.works_orders (actual_finish); corvus_mrp.bom_lines with the material golden record (works order weight); finance.sales_invoices (customer name)
    owner: Production Controller
    refresh: Daily, as delivery notes are entered
    caveat: Measures despatch from our yard, not arrival on site, so haulage delays are invisible. Delivery notes do not name the works order, so "in full" relies on matching each note to the works order on the same job that finished just before it, which can pair wrongly when two finish on the same day. Delivery notes with no promised date (about 4%) are left out, and so are notes quarantined as unreadable, so the true figure could be worse.
    unit: percent
    target: 95
    direction: higher
    headline: SELECT round(100 * avg(CAST(otif AS INTEGER)), 1) FROM marts.otif_deliveries WHERE measurable
    views:
      marts.otif_deliveries: One row per delivery note with on-time, in-full and OTIF flags and the works order it is matched to.
      marts.otif_by_month: OTIF, on-time and in-full percentages by month of despatch.
      marts.otif_by_customer: OTIF, on-time and in-full percentages by customer, worst first.
      marts.otif_by_site: OTIF, on-time and in-full percentages by fabrication site.

  - id: KPI-02
    name: Labour variance
    definition: How many more (or fewer) hours the shop floor actually spent on completed work than the plan allowed.
    formula: (hours booked on completed works orders - planned hours on those works orders) / planned hours x 100
    sources: corvus_mrp.works_orders (planned_hours, status); shop_floor.time_bookings (hours, works_order)
    owner: Production Controller
    refresh: Weekly, after booking sheets are entered
    caveat: Only as good as the booking sheets. Hours booked to a wrong or non-existent works order are left out (the job cost reconciliation reports how many), and unreadable or duplicate bookings are quarantined, so actual hours are understated. Planned hours are the estimator's figure, so a large variance can mean a poor estimate rather than poor performance. Works orders still in progress are excluded from the headline.
    unit: percent
    target: 10
    direction: abs_lower
    headline: SELECT round(100 * (sum(actual_hours) - sum(planned_hours)) / sum(planned_hours), 1) FROM marts.labour_variance_by_works_order WHERE complete
    views:
      marts.labour_variance_by_works_order: Planned against booked hours for every started works order.
      marts.labour_variance_by_job: Planned against booked hours on completed works orders, by job, largest variance first.

  - id: KPI-03
    name: Material yield and offcut waste
    definition: Of the steel bars we cut, the share that ends up in finished parts, and the share left over as offcut.
    formula: cut yield = metres of cut pieces / metres of 12 m stock bars needed to cut them x 100, weighted by kg and grouped by section type; offcut waste = 100 - cut yield
    sources: corvus_mrp.bom_lines (length_mm, qty, uom); material golden record (section type, kg per metre); corvus_mrp.goods_received (received quantity, for the received-to-issued ratio)
    owner: Production Controller
    refresh: Monthly
    caveat: A theoretical yield. It assumes each BOM line is cut from its own bars, so real nesting across lines would do better, and it assumes offcuts are scrapped, although some are reused. It does not cover plate, because there is no profile nesting data. The received-to-issued ratio mixes waste with stock building up in the yard, so it is not a waste figure on its own.
    unit: percent
    target: 85
    direction: higher
    headline: SELECT round(100 * sum(used_kg) / sum(bought_kg), 1) FROM marts.material_yield_lines
    views:
      marts.material_yield_lines: Cut yield for every BOM line of sections bought in stock bars.
      marts.material_yield_by_section_type: Cut yield, offcut waste and received-to-issued ratio by section type.

  - id: KPI-04
    name: Stock accuracy
    definition: The share of stock lines where what we counted in the yard matches what the system says we have.
    formula: stock lines whose counted quantity equals the book quantity / stock lines counted x 100, against a 95% target
    sources: corvus_mrp.stock (qty_on_hand, counted_qty, unit_cost); material golden record (section type)
    owner: Production Controller
    refresh: After each cycle count; reported monthly
    caveat: Counts every line equally, so a miscounted box of washers weighs the same as a missing rack of beams; the value error beside it shows which matters. It only covers lines that have been counted, and about a third were last counted more than 90 days ago. A count that agrees with a wrong book figure would pass.
    unit: percent
    target: 95
    direction: higher
    headline: SELECT accuracy_pct FROM marts.stock_accuracy WHERE site_code = 'All sites'
    views:
      marts.stock_accuracy: Stock line accuracy and value error by site and for all sites, against target.

  - id: KPI-05
    name: Three-way match exception rate
    definition: The share of steel purchase orders that do not match cleanly across order, delivery and invoice, and the money tied up in all purchasing exceptions.
    formula: PO lines with a quantity or price variance, missing GRN or missing invoice / PO lines assessed x 100; value at risk = sum of value at risk on those lines plus invoices with no PO
    sources: corvus_mrp.purchase_orders (qty, unit_price, promised_date); corvus_mrp.goods_received (qty_received, received_date); finance.purchase_invoices (net_amount, po_reference, nominal_code)
    owner: Finance Manager
    refresh: Weekly, and at month end before the accruals are posted
    caveat: Value at risk is not money lost. Most of it is subcontract and service spend with no purchase order, which is a control weakness but may be correctly priced; that spend is in the value but not the rate, because it has no order to match against. A 2% quantity tolerance flags every short delivery, even where the shortfall was agreed with the stockholder. Corvus orders carry one line each, so a partial delivery against a multi-line order would not show here. Orders not yet due for receipt or invoice are excluded until they are.
    unit: percent
    target: 5
    direction: lower
    headline: SELECT round(100 * sum(po_line_exceptions) / sum(po_lines_assessed), 1) FROM marts.three_way_exception_rate
    secondary:
      label: Value at risk
      unit: GBP
      sql: SELECT round(sum(value_at_risk), 2) FROM marts.three_way_value_at_risk WHERE category <> 'matched'
    views:
      marts.three_way_exception_rate: Exception rate and value at risk by month.
      marts.three_way_value_at_risk: Lines, value at risk and items over 90 days old by match category.

  - id: KPI-06
    name: Material traceability coverage
    definition: The share of steel used on our works orders that we can trace back to the mill certificate and cast it came from.
    formula: kg of BOM material on started works orders whose supplying receipts all carry a heat number and mill certificate and state the grade / total kg x 100
    sources: corvus_mrp.goods_received (heat_number, mill_cert_ref, material_code, received_date); corvus_mrp.bom_lines; corvus_mrp.works_orders; shop_floor.delivery_notes
    owner: Quality Manager
    refresh: Daily
    caveat: Corvus records no material issues, so which delivery went into which works order is inferred by allocating deliveries first-in first-out. A real audit would need the cutting lists. A chain that shows as complete here has the right references on file; that does not prove the certificates were checked or the steel physically marked. The target is 100%, because EN 1090 allows no gaps.
    unit: percent
    target: 100
    direction: higher
    headline: SELECT round(100 * sum(CASE WHEN material_chain_complete THEN kg END) / sum(kg), 1) FROM recon.trace_lines
    views:
      marts.traceability_coverage: Traceability coverage by month and site, with despatched lines that are not traced.

  - id: KPI-07
    name: WIP value and ageing
    definition: The value of work started on the shop floor but not yet delivered, and how long it has been sitting there.
    formula: for works orders started and not cancelled, closed or despatched, BOM material value + hours booked to date x standard rate; aged from the first booking (or planned start) into 0-30, 31-60, 61-90 and 90+ day buckets
    sources: corvus_mrp.works_orders (status, planned_start); corvus_mrp.bom_lines with material prices from corvus_mrp.purchase_orders; shop_floor.time_bookings (hours, booking_date); shop_floor.delivery_notes
    owner: Finance Manager
    refresh: Monthly, at period end
    caveat: Material is counted in full from the start of the works order, because Corvus does not record when steel is issued, so early-stage WIP is overstated. Labour is at a standard rate with no overhead. Works orders left open after the work has gone count as WIP until someone closes them, and many are, so the 90+ bucket is partly an admin backlog rather than stuck work.
    unit: GBP
    target: null
    direction: none
    headline: SELECT round(sum(wip_value), 2) FROM marts.wip_works_orders
    secondary:
      label: Share of WIP over 90 days
      unit: percent
      sql: SELECT round(100 * sum(wip_value) FILTER (WHERE age_bucket = '90+ days') / sum(wip_value), 1) FROM marts.wip_works_orders
    views:
      marts.wip_works_orders: Every works order in WIP with its value, age and bucket.
      marts.wip_ageing: WIP value and count by age bucket.

  - id: KPI-08
    name: Capacity utilisation
    definition: The share of the hours our people were available in a week that were booked to jobs.
    formula: booked hours / available hours x 100, by week and site, as reported on the supervisors' weekly capacity sheet
    sources: shop_floor.weekly_capacity (available_hours, booked_hours, site, week_commencing); shop_floor.time_bookings (hours, as a cross-check)
    owner: Production Controller
    refresh: Weekly
    caveat: Uses the supervisors' own weekly totals, which drift a few per cent from the individual booking sheets (the cross-check column shows by how much). High utilisation is not the same as productive utilisation, because hours spent on rework count as booked. Weeks with no booked figure are left out.
    unit: percent
    target_low: 75
    target_high: 95
    direction: band
    headline: SELECT round(100 * sum(booked_hours) / sum(available_hours) FILTER (WHERE booked_hours IS NOT NULL), 1) FROM marts.capacity_utilisation
    views:
      marts.capacity_utilisation: Booked against available hours by week and site, with the booking-sheet cross-check.
      marts.capacity_utilisation_by_site: Utilisation by site over the whole period.

  - id: KPI-09
    name: NCR rate and cost of quality
    definition: How often something we make goes wrong, and what putting it right costs as a share of what we sell.
    formula: cost of quality = sum of NCR cost impact / sales turnover x 100; NCR rate = NCRs raised per 100 tonnes despatched
    sources: shop_floor.ncr_log (raised_date, cost_impact, category); finance.sales_invoices (net_amount, invoice_date); shop_floor.delivery_notes (tonnage)
    owner: Quality Manager
    refresh: Monthly
    caveat: Covers only failure costs recorded on NCRs, not prevention or inspection, so the true cost of quality is higher. About a fifth of NCRs have no cost entered and count as nil. Turnover follows invoice timing, including applications for payment, so a single month's percentage can swing. Problems found and fixed without an NCR are invisible.
    unit: percent
    target: 2
    direction: lower
    headline: SELECT round(100 * sum(ncr_cost) / sum(turnover), 2) FROM marts.quality_cost_by_month
    secondary:
      label: NCRs per 100 tonnes despatched
      unit: count
      sql: SELECT round(100 * sum(ncrs) / sum(tonnes_despatched), 2) FROM marts.quality_cost_by_month
    views:
      marts.quality_cost_by_month: NCRs, NCR cost, turnover, tonnes despatched, cost of quality and NCR rate by month.
      marts.ncr_by_category: NCR count, cost and open NCRs by category.
